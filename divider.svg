<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="1200" height="8" role="img" aria-label="section divider">
  <title>section divider</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#30363d" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#30363d" stop-opacity="0.9"/>
      <stop offset="80%"  stop-color="#30363d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3fd0e0" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#3fd0e0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3fd0e0" stop-opacity="0"/>
    </linearGradient>

    <style>
      .travel { animation: travel 9s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      @keyframes travel {
        0%        { transform: translateX(-260px); opacity: 0; }
        12%       { opacity: 1; }
        88%       { opacity: 1; }
        100%      { transform: translateX(1200px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { .travel { animation: none; opacity: 0; } }
    </style>
  </defs>

  <rect x="0" y="3.25" width="1200" height="1.5" fill="url(#base)"/>
  <rect class="travel" x="0" y="3.25" width="260" height="1.5" fill="url(#pulse)"/>
</svg>
